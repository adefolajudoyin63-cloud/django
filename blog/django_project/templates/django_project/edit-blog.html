{% extends "django_project/base.html" %}

{% block title %}Edit Entry — Lumen{% endblock %}

{% block content %}
    <main class="create-container">
        <h1 class="page-title">Edit Journal Entry</h1>
        <p class="page-subtitle">Revise your thoughts with the same care you wrote them.</p>

        <div class="editor-card">
            <form class="editor-form" method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="headline">Headline</label>
                    <input
                        type="text"
                        id="headline"
                        name="headline"
                        class="title-input"
                        placeholder="Enter article title..."
                        value="{{ blog.headline }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="body">Body</label>
                    <textarea
                        id="body"
                        name="body"
                        placeholder="Write your essay thoughts here..."
                        required
                    >{{ blog.body }}</textarea>
                </div>

                <div class="form-actions">
                    <a href="{% url 'article' blog.pk %}" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-publish">
                        Save Changes <span class="arrow">→</span>
                    </button>
                </div>
            </form>
        </div>
    </main>
{% endblock %}
