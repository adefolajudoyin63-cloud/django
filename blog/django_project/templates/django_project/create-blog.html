{% extends "django_project/base.html" %}

{% block title %}Create Entry — Lumen{% endblock %}

{% block content %}
    <main class="create-container">
        <h1 class="page-title">New Journal Entry</h1>
        <p class="page-subtitle">Share your thoughts with clarity and intention.</p>

        <div class="editor-card">
            <form class="editor-form" method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_headline">Headline</label>
                    {{ form.headline }}
                </div>

                <div class="form-group">
                    <label for="id_body">Body</label>
                    {{ form.body }}
                </div>

                <div class="form-actions">
                    <a href="{% url 'home' %}" class="btn-cancel">Discard Draft</a>
                    <button type="submit" class="btn-publish">
                        Publish Entry <span class="arrow">→</span>
                    </button>
                </div>
            </form>
        </div>
    </main>
{% endblock %}
