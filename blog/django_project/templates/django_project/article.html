{% extends "django_project/base.html" %}

{% block title %}{{ blog.headline }} — Lumen{% endblock %}

{% block content %}
    <article class="article-container">
        <a href="{% url 'home' %}" class="back-link">← Back to Essays</a>

        <header class="article-header">
            <div class="article-title-row">
                <h1 class="article-title">{{ blog.headline }}</h1>
                {% if user == blog.author %}
                    <a href="{% url 'edit_blog' blog.pk %}" class="btn-edit">Edit</a>
                {% endif %}
            </div>

            <div class="article-meta">
                <span class="author">{{ blog.author }}</span>
                <span class="dot">•</span>
                <time datetime="{{ blog.published_at }}">{{ blog.published_at }}</time>
            </div>
        </header>

        <div class="article-body">
            {{ blog.body|linebreaks }}
        </div>
    </article>
{% endblock %}
