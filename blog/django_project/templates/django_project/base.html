<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Lumen{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #0d0d0f;
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-hover-bg: rgba(255, 255, 255, 0.05);
        --text-primary: #e8e6e1;
        --text-muted: #949086;
        --accent: #d4a373;
        --accent-glow: rgba(212, 163, 115, 0.15);
        --border-color: rgba(255, 255, 255, 0.07);
        --border-hover: rgba(212, 163, 115, 0.35);
        --font-display: "Italiana", serif;
        --font-sans: "Plus Jakarta Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-image:
          radial-gradient(circle at 15% 20%, rgba(212, 163, 115, 0.06) 0%, transparent 45%),
          radial-gradient(circle at 85% 80%, rgba(138, 100, 70, 0.05) 0%, transparent 50%);
        background-attachment: fixed;
      }

      a {
        color: inherit;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .header {
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
        padding: 4rem 2rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
      }

      .brand {
        font-family: var(--font-display);
        font-size: 2.2rem;
        letter-spacing: 1px;
        color: var(--text-primary);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 2rem;
        list-style: none;
      }

      .nav-links a,
      .nav-links button {
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 500;
        background: none;
        border: none;
        font-family: inherit;
        cursor: pointer;
      }

      .nav-links a:hover,
      .nav-links button:hover {
        color: var(--accent);
      }

      .nav-logout-form {
        display: inline;
        margin: 0;
      }

      .site-content {
        flex: 1;
      }

      .footer {
        text-align: center;
        padding: 4rem 1.5rem;
        border-top: 1px solid var(--border-color);
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 300;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 4rem 2rem 6rem;
      }

      .content-grid {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 4.5rem;
      }

      .posts-feed {
        display: flex;
        flex-direction: column;
        gap: 3rem;
      }

      .post-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 3rem;
        border-radius: 20px;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }

      .post-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .post-card:hover {
        background: var(--card-hover-bg);
        border-color: var(--border-hover);
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--accent-glow);
      }

      .post-card:hover::before {
        opacity: 1;
      }

      .post-headline-row,
      .article-title-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .post-card h2,
      .article-title {
        font-family: var(--font-display);
        line-height: 1.25;
        font-weight: 400;
        color: var(--text-primary);
        letter-spacing: 0.5px;
      }

      .post-card h2 {
        font-size: 2.4rem;
        margin-bottom: 0;
        flex: 1;
      }

      .post-meta,
      .article-meta {
        font-size: 0.8rem;
        color: var(--text-muted);
        display: flex;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      .post-meta .author,
      .article-meta .author {
        color: var(--accent);
        font-weight: 600;
      }

      .post-body,
      .article-body {
        font-size: 0.95rem;
        color: var(--text-muted);
        font-weight: 300;
        line-height: 1.8;
        margin-bottom: 2rem;
      }

      .post-footer {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .read-more,
      .btn-delete,
      .btn-edit,
      .btn-publish,
      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 0.6rem 1.2rem;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-color);
        transition: all 0.3s ease;
      }

      .read-more {
        color: var(--text-primary);
      }

      .btn-edit {
        color: var(--accent);
        flex-shrink: 0;
      }

      .btn-delete {
        color: var(--text-primary);
        font-family: inherit;
        line-height: inherit;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
      }

      .read-more:hover,
      .btn-edit:hover,
      .btn-publish:hover,
      .action-btn:hover {
        background: var(--accent);
        color: #0d0d0f;
        border-color: var(--accent);
        box-shadow: 0 0 15px var(--accent-glow);
      }

      .btn-delete:hover {
        background: #c25953;
        color: #0d0d0f;
        border-color: #c25953;
        box-shadow: 0 0 15px rgba(194, 89, 83, 0.35);
      }

      .empty-feed {
        color: var(--text-muted);
        font-style: italic;
        padding: 2rem 0;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 3rem;
      }

      .widget-title {
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 1px;
        margin-bottom: 1.2rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-primary);
      }

      .about-widget p,
      .newsletter-widget p {
        font-size: 0.875rem;
        color: var(--text-muted);
        font-weight: 300;
        line-height: 1.8;
      }

      .newsletter-form input {
        width: 100%;
        padding: 0.9rem 1.1rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        font-family: inherit;
        font-size: 0.85rem;
        color: var(--text-primary);
        margin-bottom: 0.75rem;
        outline: none;
      }

      .newsletter-form input:focus {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.06);
      }

      .newsletter-form button {
        width: 100%;
        padding: 0.9rem;
        background: var(--accent);
        color: #0d0d0f;
        border: none;
        border-radius: 12px;
        font-size: 0.75rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
        cursor: pointer;
      }

      .create-container,
      .article-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 3rem 2rem 6rem;
      }

      .page-title {
        font-family: var(--font-display);
        font-size: 2.8rem;
        font-weight: 400;
        margin-bottom: 0.5rem;
        letter-spacing: 0.5px;
      }

      .page-subtitle {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 3rem;
        font-weight: 300;
      }

      .editor-card,
      .delete-modal-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 3rem;
        border-radius: 20px;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .editor-form {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      label {
        font-size: 0.75rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }

      input[type="text"],
      input[type="date"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 1rem 1.2rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        font-family: inherit;
        font-size: 0.95rem;
        color: var(--text-primary);
        outline: none;
        transition: all 0.3s ease;
      }

      input[type="text"]:focus,
      input[type="date"]:focus,
      input[type="email"]:focus,
      textarea:focus {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 0 15px var(--accent-glow);
      }

      textarea {
        min-height: 250px;
        resize: vertical;
        line-height: 1.8;
        font-weight: 300;
      }

      .form-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border-color);
      }

      .btn-cancel {
        font-size: 0.75rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 500;
      }

      .btn-cancel:hover {
        color: var(--text-primary);
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.75rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 3rem;
        font-weight: 500;
      }

      .back-link:hover {
        color: var(--accent);
      }

      .article-header {
        margin-bottom: 3rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 2.5rem;
      }

      .article-title {
        font-size: 3.2rem;
        margin-bottom: 0;
        flex: 1;
      }

      .article-body p::first-letter {
        font-family: var(--font-display);
        font-size: 3.5rem;
        float: left;
        line-height: 0.8;
        margin-right: 0.8rem;
        margin-top: 0.2rem;
        color: var(--accent);
      }

      .article-body blockquote {
        font-family: var(--font-display);
        font-size: 1.8rem;
        line-height: 1.35;
        color: var(--accent);
        border-left: 1px solid var(--accent);
        padding-left: 2rem;
        margin: 2rem 0;
        font-style: italic;
      }

      .delete-modal[hidden] {
        display: none;
      }

      .delete-modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .delete-modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(8, 8, 10, 0.72);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }

      .delete-modal-card {
        position: relative;
        width: min(440px, 100%);
        background: #161618;
      }

      .delete-modal-kicker {
        font-size: 0.72rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #c25953;
        font-weight: 600;
        margin-bottom: 0.55rem;
      }

      .delete-modal-card h2 {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 400;
        line-height: 1.15;
        letter-spacing: 0.4px;
        margin-bottom: 0.75rem;
      }

      .delete-modal-copy {
        color: var(--text-muted);
        font-weight: 300;
        font-size: 0.95rem;
        margin-bottom: 1.8rem;
      }

      .delete-modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.75rem;
      }

      .delete-modal-cancel,
      .delete-modal-confirm {
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-radius: 30px;
        padding: 0.7rem 1.3rem;
        cursor: pointer;
      }

      .delete-modal-cancel {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border-color);
      }

      .delete-modal-confirm {
        background: #c25953;
        color: #0d0d0f;
        border: 1px solid #c25953;
      }

      body.modal-open {
        overflow: hidden;
      }

      @media (max-width: 800px) {
        .content-grid {
          grid-template-columns: 1fr;
          gap: 4rem;
        }

        .header {
          padding-top: 2.5rem;
        }

        .post-card,
        .editor-card,
        .delete-modal-card {
          padding: 2rem;
        }

        .post-card h2,
        .article-title {
          font-size: 1.9rem;
        }
      }

      {% block extra_css %}{% endblock %}
    </style>
  </head>
  <body>
    <header class="header">
      <a href="{% url 'home' %}" class="brand">LUMEN.</a>
      <ul class="nav-links">
        <li><a href="{% url 'about' %}">About</a></li>
        {% if user.is_authenticated %}
          <li><a href="{% url 'my_blogs' %}">My Blogs</a></li>
          <li><a href="{% url 'create_blog' %}">Write</a></li>
          <li>
            <form action="{% url 'logout' %}" method="post" class="nav-logout-form">
              {% csrf_token %}
              <button type="submit">Log out</button>
            </form>
          </li>
        {% else %}
          <li><a href="{% url 'login' %}">Log in</a></li>
          <li><a href="{% url 'signup' %}">Sign up</a></li>
        {% endif %}
      </ul>
    </header>

    <div class="site-content">
      {% block content %}{% endblock %}
    </div>

    <footer class="footer">
      <p>&copy; 2026 Lumen Journal. All rights reserved.</p>
    </footer>
  </body>
</html>
